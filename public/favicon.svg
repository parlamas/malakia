<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Top row - lime dots -->
  <circle cx="20" cy="30" r="8" fill="#32CD32"/>
  <circle cx="50" cy="30" r="8" fill="#32CD32"/>
  <circle cx="80" cy="30" r="8" fill="#32CD32"/>
  
  <!-- Middle row - black dots -->
  <circle cx="35" cy="60" r="8" fill="#32CD32"/>
  <circle cx="65" cy="60" r="8" fill="#32CD32"/>
  
  <!-- Bottom row - lime dot -->
  <circle cx="50" cy="90" r="8" fill="#32CD32"/>
  
  <!-- Connection lines - keep as dark gray -->
  <line x1="20" y1="30" x2="35" y2="60" stroke="#333" stroke-width="2"/>
  <line x1="50" y1="30" x2="35" y2="60" stroke="#333" stroke-width="2"/>
  <line x1="50" y1="30" x2="65" y2="60" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="30" x2="65" y2="60" stroke="#333" stroke-width="2"/>
  <line x1="35" y1="60" x2="50" y2="90" stroke="#333" stroke-width="2"/>
  <line x1="65" y1="60" x2="50" y2="90" stroke="#333" stroke-width="2"/>
</svg>